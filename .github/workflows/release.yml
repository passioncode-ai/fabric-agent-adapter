name: release

# Project-configurable, individually toggleable release automation.
#
# OFF by default: `release` runs only when the repo variable RELEASE_ENABLED is
# "true", `publish` only when PUBLISH_NPMJS is "true" (Settings -> Secrets and
# variables -> Actions -> Variables). A fork decides for itself whether to arm
# either half; no code change needed.
#
# Trigger: a v* tag, or a manual run naming an existing tag. Steps: validate ->
# version check -> pack smoke test from a clean cwd -> GitHub release carrying
# the CHANGELOG section -> npm publish with provenance. The smoke test runs
# BEFORE the release is created (FAA-73): a tarball that does not install
# leaves no public release behind.
#
# Every action is pinned to a full commit SHA with its release in a comment;
# raise one on purpose, with the SHA the release tag points at.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release and publish (defaults to the ref this runs on)"
        required: false
        type: string

jobs:
  # The whole validate suite before anything is published.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Resolve the tag to release
        id: t
        run: |
          set -eu
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.t.outputs.tag }}
          fetch-depth: 0

      - name: The tag must be reachable from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A tag pushed without its branch is a published release a fresh clone
          # cannot reach, and nothing fails loudly. Checked against the ACTUAL
          # default branch, not a hardcoded name.
          DEF="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          git fetch --no-tags origin "$DEF"
          if ! git merge-base --is-ancestor HEAD "origin/$DEF"; then
            echo "::error::${{ steps.t.outputs.tag }} points at a commit that is not an" \
                 "ancestor of origin/$DEF. Push the branch, then re-run this job."
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is an ancestor of origin/$DEF"

      - name: Structural validator (gate the release on a valid repo)
        run: |
          set -eu
          python3 test/validate.py

      - name: Tag must match the manifests (version sync)
        run: |
          set -eu
          PV=$(python3 -c "import json;print(json.load(open('plugins/fabric-agent-adapter/.claude-plugin/plugin.json'))['version'])")
          if [ "$PV" != "${{ steps.t.outputs.ver }}" ]; then
            echo "tag ${{ steps.t.outputs.tag }} does not match $PV"; exit 1
          fi

      - name: Extract this version's CHANGELOG section
        run: |
          set -eu
          # Accept every heading shape this family has used: `## v1.2.3`,
          # `## 1.2.3`, `## [1.2.3] - date`, `## [v1.2.3]`. The terminator
          # requires a full semver, so a `## Fixed` subsection cannot end the
          # extraction early.
          awk -v v="${{ steps.t.outputs.ver }}" '
            $0 ~ "^## \\[?v?" v "\\]?([^0-9]|$)" {f=1; next}
            /^## \[?v?[0-9]+\.[0-9]+\.[0-9]+/ {f=0}
            f {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "no CHANGELOG section for ${{ steps.t.outputs.ver }}"; exit 1; }

      - name: Smoke test before anything is public (pack + npx from a clean cwd)
        run: |
          set -eu
          # Pack the checked-out tag and install the tarball: this tests the
          # exact artifact npm will serve, files whitelist included. It runs
          # before the GitHub release exists, so a failure publishes nothing.
          REPO="$PWD"
          TARBALL="$PWD/$(npm pack --silent)"
          FRESH_HOME="$(mktemp -d)"
          export HOME="$FRESH_HOME"
          cd "$(mktemp -d)"
          # A bare `npx <path.tgz>` executes the PATH as a command (126); the
          # package spec and the command must be named apart.
          npx --yes --package "$TARBALL" fabric-agent-adapter
          # Since 0.4.0 the installer writes to the agents hub, never ~/.claude/skills
          # (a plain copy there shadows the plugin). Every shipped skill must land.
          test -f "$HOME/.agents/skills/adapting-projects-to-fabric/SKILL.md"
          test -d "$HOME/.agents/skills/adapting-projects-to-fabric/references"
          test -f "$HOME/.agents/skills/building-fabric-services/SKILL.md"
          test -f "$HOME/.agents/skills/creating-fabric-agents/SKILL.md"
          test -f "$HOME/.agents/skills/working-with-fabric/SKILL.md"
          test -f "$HOME/.agents/skills/working-with-fabric/scripts/fabric_session.py"
          test -f "$HOME/.agents/skills/building-fabric-services/scripts/fabric_interop.py"
          test -f "$HOME/.agents/skills/adapting-projects-to-fabric/scripts/fabric_provider.py"
          test ! -e "$HOME/.claude/skills"
          # The installed copies must survive a strict YAML reader, not only Claude Code.
          python3 "$REPO/test/validate.py" --frontmatter "$HOME"/.agents/skills/*/SKILL.md
          echo "OK: ${{ steps.t.outputs.tag }} installs cleanly from the packed tarball"

      - name: Create or refresh the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${{ steps.t.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.t.outputs.tag }}" --notes-file /tmp/notes.md
            echo "release ${{ steps.t.outputs.tag }} already existed: notes refreshed"
          else
            gh release create "${{ steps.t.outputs.tag }}" \
              --title "${{ steps.t.outputs.tag }}: fabric-agent-adapter" \
              --notes-file /tmp/notes.md --latest
          fi

  publish:
    # Auth works two ways on purpose. NODE_AUTH_TOKEN comes from the NPM_TOKEN
    # secret (a GRANULAR AUTOMATION token; a classic token is refused by 2FA).
    # `id-token: write` is granted regardless, which is what npm trusted
    # publishing (OIDC) needs, and it signs provenance.
    # OPEN HUMAN STEP (FAA-73, decision D8): register this workflow file as the
    # package's trusted publisher on npmjs.com (needs the operator's npmjs.com
    # sign-in), then delete the NPM_TOKEN secret and the NODE_AUTH_TOKEN line
    # below. Until then the standing token stays, because without it nothing
    # publishes.
    needs: release
    if: vars.PUBLISH_NPMJS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve the tag to publish
        id: t
        run: |
          set -eu
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.t.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npm must be new enough for trusted publishing (11.5.1 or later)
        run: |
          set -eu
          # An exact release, never the moving latest tag: this job holds id-token: write. 12.2.0 is the npm that
          # published 0.40.0 with this token; 11.21.1 was refused with E401 "token is invalid" (v0.41.0, FAA-73).
          npm install -g npm@12.2.0
          npm --version

      - name: The tag must match what would be published
        run: |
          set -eu
          PV=$(node -p "require('./package.json').version")
          if [ "$PV" != "${{ steps.t.outputs.ver }}" ]; then
            echo "tag ${{ steps.t.outputs.tag }} != package.json $PV"; exit 1
          fi

      - name: Is this version already on the registry?
        id: pub
        run: |
          set -eu
          NAME=$(node -p "require('./package.json').name")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Publishing over an existing version is a hard 403, so a re-run or a
          # tag pushed after a manual publish must not fail the release.
          if npm view "$NAME@${{ steps.t.outputs.ver }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@${{ steps.t.outputs.ver }} already published: nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.pub.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          # The repository is public (since 2026-09-29), so every publish
          # carries Sigstore provenance.
          npm publish --provenance

      - name: The registry must actually serve it
        if: steps.pub.outputs.skip == 'false'
        run: |
          set -eu
          # The read replica lags the write master: "published" is a claim
          # until it is served; poll instead of trusting the exit code alone.
          # 18x10s missed the FIRST scoped publish of this package by seconds
          # (+4 min for 0.3.1; 0.4.3 on 2026-09-29 was still unserved at +5 min); 10 minutes.
          for _ in $(seq 1 60); do
            got=$(npm view "${{ steps.pub.outputs.name }}" version 2>/dev/null || echo "")
            if [ "$got" = "${{ steps.t.outputs.ver }}" ]; then
              echo "OK: registry serves ${{ steps.pub.outputs.name }}@$got"
              exit 0
            fi
            sleep 10
          done
          echo "registry still does not serve ${{ steps.t.outputs.ver }} after 10 minutes"
          exit 1
