name: validate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s test -v
      - run: python3 test/validate.py
      - run: node --test 'test/*.test.mjs'

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate ./plugins/fabric-agent-adapter --strict
      - run: claude plugin validate . --strict

  # DEC-0032: both service kits on Windows — the instance lock between two processes (and between the
  # kits), a token file's ACL written and read back, the refusals the rule names. They skip elsewhere.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Before the Python cases: one of them probes a Node service's lock.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DEC-0032 platform cases (Windows ones run here)
        run: python -m unittest discover -s test -p "test_fabric_service_platforms.py" -v
      - name: The rest of the service kit's cases on Windows
        run: python -m unittest discover -s test -p "test_fabric_service.py" -v
      - name: The supervisor writers on Windows (FAA-21)
        run: python -m unittest discover -s test -p "test_fabric_service_supervisors.py" -v
      - name: The Node kit on Windows — its lock, token ACL and writers (FAA-21)
        run: node --test test/fabric-service-platforms.test.mjs test/fabric-service-supervisors.test.mjs test/fabric-service.test.mjs
