name: validate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s test -v
      - run: python3 test/validate.py
      - run: node --test 'test/*.test.mjs'

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate ./plugins/fabric-agent-adapter --strict
      - run: claude plugin validate . --strict

  # DEC-0032: the service kit on Windows — the instance lock between two processes, a token file's
  # ACL written and read back, the refusals the rule names. The Windows cases skip elsewhere.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest test.test_fabric_service_platforms test.test_fabric_service -v
